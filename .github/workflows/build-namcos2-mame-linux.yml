name: Build Namco System 2 MAME (Linux)

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MAME_REF: mame0289
      SUBTARGET: namcos2mame
      MAME_SOURCES: src/mame/namco/namcos2.cpp

    steps:
      - name: Check out this workflow repository
        uses: actions/checkout@v4

      - name: Install MAME build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git build-essential python3 zip \
            libsdl2-dev libsdl2-ttf-dev libfontconfig-dev \
            libpulse-dev libasound2-dev \
            qt6-base-dev qt6-base-dev-tools qtchooser

      - name: Get official MAME 0.289 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$MAME_REF" https://github.com/mamedev/mame.git mame
          test -f mame/src/mame/namco/namcos2.cpp
          git -C mame rev-parse HEAD | tee "$RUNNER_TEMP/mame_commit.txt"
          git -C mame describe --always --tags

      - name: Compile Namco System 2 only
        shell: bash
        working-directory: mame
        run: |
          set -euo pipefail
          make -j2 \
            SUBTARGET="$SUBTARGET" \
            SOURCES="$MAME_SOURCES" \
            REGENIE=1 \
            USE_QTDEBUG=0 \
            SYMBOLS=0 \
            2>&1 | tee "$RUNNER_TEMP/namcos2-build.log"
          test -x "./$SUBTARGET"
          "./$SUBTARGET" -version

      - name: Verify Dragon Saber ROM variants and other System 2 drivers
        shell: bash
        working-directory: mame
        run: |
          set -euo pipefail
          for game in dsaber dsabera dsaberj valkyrie phelios burnforc rthun2; do
            "./$SUBTARGET" -listfull "$game" | tee "$RUNNER_TEMP/${game}-listfull.txt"
            "./$SUBTARGET" -listfull "$game" | grep -E "^${game}[[:space:]]+" >/dev/null || {
              echo "ERROR: $game was not included in this MAME binary" >&2
              exit 1
            }
            "./$SUBTARGET" -listxml "$game" > "$RUNNER_TEMP/${game}.xml"
          done
          "./$SUBTARGET" -listsource > "$RUNNER_TEMP/namcos2-list-source.txt"

      - name: Package reusable binary, dependencies, source, checks
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/namcos2-mame-linux-x86_64"
          mkdir -p "$OUT/lib" "$OUT/roms" "$OUT/diagnostics" "$OUT/source"
          cp "mame/$SUBTARGET" "$OUT/namcos2mame"
          cp "$RUNNER_TEMP/namcos2-build.log" "$OUT/diagnostics/build.log"
          cp "$RUNNER_TEMP/mame_commit.txt" "$OUT/diagnostics/mame_commit.txt"
          cp "$RUNNER_TEMP/"*-listfull.txt "$OUT/diagnostics/"
          cp "$RUNNER_TEMP/"*.xml "$OUT/diagnostics/"
          cp "$RUNNER_TEMP/namcos2-list-source.txt" "$OUT/diagnostics/"
          cp mame/src/mame/namco/namcos2* "$OUT/source/"
          cp mame/src/devices/sound/ymopm.cpp "$OUT/source/"
          cp mame/src/devices/sound/ymopm.h "$OUT/source/"
          cp mame/src/devices/sound/c140.cpp "$OUT/source/"
          cp mame/src/devices/sound/c140.h "$OUT/source/"
          if [ -f mame/COPYING ]; then cp mame/COPYING "$OUT/"; fi
          cp .github/workflows/build-namcos2-mame-linux.yml "$OUT/diagnostics/build-workflow.yml"
          ldd "$OUT/namcos2mame" | tee "$OUT/diagnostics/ldd.txt"

          # Bundle direct shared-library dependencies, excluding host glibc.
          # Runner: Ubuntu 24.04; another Linux distro may require matching libc.
          while IFS= read -r so; do
            [ -f "$so" ] || continue
            base="$(basename "$so")"
            case "$base" in
              libc.so.*|libm.so.*|libpthread.so.*|librt.so.*|libdl.so.*|libresolv.so.*|libnss_*|ld-linux*|libanl.so.*|libutil.so.*)
                continue ;;
            esac
            cp -L "$so" "$OUT/lib/$base"
          done < <(ldd "$OUT/namcos2mame" | awk '$2 == "=>" && $3 ~ /^\// {print $3}' | sort -u)

          cat > "$OUT/run-mame.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd "$HERE"
          exec "$HERE/namcos2mame" "$@"
          SH
          chmod +x "$OUT/run-mame.sh"

          cat > "$OUT/README.txt" <<TXT
          Namco System 2 MAME (Linux x86_64), for Dragon Saber and other System 2 audio analysis
          MAME release: $MAME_REF
          MAME commit: $(git -C mame rev-parse HEAD)
          Driver source: $MAME_SOURCES
          Build subtarget: $SUBTARGET
          Included systems verified: dsaber, dsabera, dsaberj, valkyrie, phelios, burnforc, rthun2
          Lua runtime support: standard MAME feature (not runtime-tested here)

          No game ROMs are included. Put your own compatible ROM sets in roms/.
          For a clone set such as dsaberj, a matching parent dsaber set may
          also be required if the clone ZIP does not contain all required ROMs.

          Examples:
             ./run-mame.sh -version
             ./run-mame.sh -listfull dsaber
             ./run-mame.sh -listxml dsaber
             ./run-mame.sh dsaber -window
             ./run-mame.sh dsaber -autoboot_script /path/to/capture.lua

          Build machine: GitHub Actions ubuntu-24.04 x86_64.
          For reproduction, see diagnostics/build-workflow.yml and build.log.
          NOTE: Lua register tracing and ROM execution are to be tested separately.
          TXT

          (
            cd "$OUT"
            ./run-mame.sh -version > diagnostics/version.txt
            find . -type f ! -name 'SHA256SUMS.txt' -print0 \
              | sort -z | xargs -0 sha256sum > diagnostics/SHA256SUMS.txt
          )
          (
            cd "$GITHUB_WORKSPACE"
            zip -q -r -9 namcos2-mame-linux-x86_64.zip namcos2-mame-linux-x86_64
          )
          test -s "$GITHUB_WORKSPACE/namcos2-mame-linux-x86_64.zip"
          (cd "$GITHUB_WORKSPACE" && sha256sum namcos2-mame-linux-x86_64.zip \
            | tee namcos2-mame-linux-x86_64.zip.sha256)
          ls -lh "$GITHUB_WORKSPACE/namcos2-mame-linux-x86_64.zip"

      - name: Upload compiled MAME
        uses: actions/upload-artifact@v6
        with:
          name: namcos2-mame-linux-x86_64
          path: |
            namcos2-mame-linux-x86_64.zip
            namcos2-mame-linux-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 30

